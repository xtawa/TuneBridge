services:
  tunebridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: tunebridge:latest
    container_name: tunebridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TUNEBRIDGE_DATA_DIR=/data
      - TUNEBRIDGE_WEBDAV_USERNAME=${TUNEBRIDGE_WEBDAV_USERNAME:?TUNEBRIDGE_WEBDAV_USERNAME is required from caller environment}
      - TUNEBRIDGE_WEBDAV_PASSWORD=${TUNEBRIDGE_WEBDAV_PASSWORD:?TUNEBRIDGE_WEBDAV_PASSWORD is required from caller environment}
      - TUNEBRIDGE_NETEASE_API_BASE_URL=${TUNEBRIDGE_NETEASE_API_BASE_URL:-}
      - TUNEBRIDGE_SESSION_ENCRYPTION_KEY=${TUNEBRIDGE_SESSION_ENCRYPTION_KEY:-}
      - TUNEBRIDGE_PREFERRED_QUALITY=${TUNEBRIDGE_PREFERRED_QUALITY:-lossless}
      - TUNEBRIDGE_LYRICS_MODE=${TUNEBRIDGE_LYRICS_MODE:-original_translation}
    volumes:
      - tunebridge-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tunebridge-data:
