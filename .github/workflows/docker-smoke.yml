name: Docker smoke

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag tunebridge:ci .
      - name: Validate Compose configuration
        env:
          TUNEBRIDGE_WEBDAV_USERNAME: ci-user
          TUNEBRIDGE_WEBDAV_PASSWORD: ci-password
        run: docker compose config --quiet
